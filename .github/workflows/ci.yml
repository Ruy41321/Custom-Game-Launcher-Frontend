name: CI

# Runs on `main`, which is where work arrives once the maintainer has merged it. `dev` is
# checked locally instead — `dotnet test GameLauncher.sln` and `dotnet format --verify-no-changes`
# before every push — so a run here is a second opinion about the three operating systems and
# the four publish RIDs rather than the first time anybody has seen the suite.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # global.json pins the SDK, so CI compiles with the same analyzer set as the
      # maintainer's machine. `9.0.x` silently drifted ahead and failed on a rule that
      # does not exist locally, which is impossible to reproduce before pushing.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet restore GameLauncher.sln

      - name: Verify formatting
        run: dotnet format GameLauncher.sln --verify-no-changes --no-restore

  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The client ships for all three desktop platforms, so all three are built here.
        # macOS in particular is not verifiable on the maintainer's machine.
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      # global.json pins the SDK, so CI compiles with the same analyzer set as the
      # maintainer's machine. `9.0.x` silently drifted ahead and failed on a rule that
      # does not exist locally, which is impossible to reproduce before pushing.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet restore GameLauncher.sln

      - run: dotnet build GameLauncher.sln -c Release --no-restore

      - run: dotnet test GameLauncher.sln -c Release --no-build --verbosity normal

  publish-check:
    name: Publish check (${{ matrix.rid }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, linux-x64, osx-x64, osx-arm64]

    steps:
      - uses: actions/checkout@v7

      # global.json pins the SDK, so CI compiles with the same analyzer set as the
      # maintainer's machine. `9.0.x` silently drifted ahead and failed on a rule that
      # does not exist locally, which is impossible to reproduce before pushing.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Catches runtime-identifier problems (trimming, native assets) that a plain build
      # would not surface until release day.
      - name: Publish self-contained
        run: |
          dotnet publish src/GameLauncher.App/GameLauncher.App.csproj \
            -c Release -r ${{ matrix.rid }} --self-contained \
            -o artifacts/${{ matrix.rid }}
